<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MineXcore | Minecraft Server</title>
    <style>
        /* Globální styly inspirované webem Outlands */
        :root {
            --primary: #4CAF50;
            --primary-glow: rgba(76, 175, 80, 0.3);
            --bg-dark: #0a0a0a;
            --bg-card: #121212;
            --bg-nav: #121212;
            --text-main: #ffffff;
            --text-muted: #b3b3b3;
            --border: #1f1f1f;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            scroll-behavior: smooth;
        }

        /* Navigační menu */
        nav {
            background-color: var(--bg-nav);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 20px 0;
            border-bottom: 1px solid var(--border);
            text-align: center;
        }
        nav .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }
        nav .logo-text {
            font-weight: bold;
            font-size: 1.3em;
            letter-spacing: 2px;
            color: var(--text-main);
        }
        nav .links a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 25px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85em;
            transition: color 0.3s;
        }
        nav .links a:hover {
            color: var(--primary);
        }

        /* Hero Sekce (Hlavička) */
        header {
            position: relative;
            background: linear-gradient(rgba(10,10,10,0.5), rgba(10,10,10,0.95)), url('pozadi.png') no-repeat center center/cover;
            padding: 120px 20px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            min-height: 350px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .header-sub {
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: bold;
            font-size: 0.9em;
            margin-bottom: 10px;
        }
        h1 {
            margin: 0;
            font-size: 4.5em;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 5px;
            font-weight: 900;
            text-shadow: 0 0 30px var(--primary-glow);
        }
        .header-desc {
            color: var(--text-muted);
            font-size: 1.2em;
            max-width: 600px;
            margin: 20px 0 40px 0;
        }
        .cta-buttons {
            display: flex;
            gap: 15px;
        }
        .btn {
            padding: 14px 30px;
            border-radius: 6px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9em;
            text-decoration: none;
            transition: all 0.3s;
            cursor: pointer;
        }
        .btn-primary {
            background-color: var(--primary);
            color: #000;
            border: none;
            box-shadow: 0 0 20px var(--primary-glow);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px var(--primary);
        }
        .btn-secondary {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover {
            background-color: #121212;
            border-color: var(--text-muted);
        }

        /* Statistiky / Status bar */
        .status-bar {
            max-width: 1000px;
            margin: -40px auto 60px auto;
            position: relative;
            z-index: 10;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            padding: 20px;
            gap: 20px;
        }
        .status-item {
            text-align: center;
            border-right: 1px solid var(--border);
        }
        .status-item:last-child {
            border-right: none;
        }
        .status-title {
            color: var(--text-muted);
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .status-value {
            font-size: 1.3em;
            font-weight: bold;
            color: var(--text-main);
        }
        .status-value.online {
            color: var(--primary);
        }

        /* Hlavní kontejnery pro sekce */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        section {
            padding: 80px 0;
            border-bottom: 1px solid var(--border);
        }
        section:last-child {
            border-bottom: none;
        }
        .section-title {
            font-size: 2.2em;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            font-weight: 800;
        }
        .section-desc {
            color: var(--text-muted);
            margin-bottom: 5px;
            text-transform: uppercase;
            font-size: 0.85em;
            letter-spacing: 2px;
            color: var(--primary);
        }

        /* Grid pro vlastnosti serveru "O serveru" */
        .grid-features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-top: 5px;
        }
        .feature-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 35px;
            text-align: left;
            transition: border-color 0.3s, transform 0.3s;
        }
        .feature-card:hover {
            border-color: var(--primary);
            transform: translateY(-3px);
        }
        .feature-card h3 {
            margin: 0 0 15px 0;
            font-size: 1.4em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .feature-card p {
            color: var(--text-muted);
            margin: 0;
            line-height: 1.6;
        }

        /* Rozbalovací Pravidla (Accordion z Outlands) */
        .accordion {
            max-width: 800px;
            margin: 40px auto 0 auto;
            text-align: left;
        }
        .accordion-item {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 15px;
            overflow: hidden;
        }
        .accordion-header {
            padding: 22px 30px;
            font-weight: bold;
            font-size: 1.1em;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            transition: background 0.3s;
        }
        .accordion-header:hover {
            background-color: #161616;
        }
        .accordion-header::after {
            content: '＋';
            color: var(--primary);
            font-size: 1.2em;
        }
        /* Logika pro rozbalení bez JavaScriptu přes detaily */
        details summary {
            list-style: none;
        }
        details summary::-webkit-details-marker {
            display: none;
        }
        .accordion-content {
            padding: 0 30px 25px 30px;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }
        .accordion-content ul {
            margin: 0;
            padding-left: 20px;
        }
        .accordion-content li {
            margin-bottom: 12px;
            line-height: 1.5;
        }
        .accordion-content li::marker {
            color: var(--primary);
        }

        /* Mapa */
        .map-wrapper {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            margin-top: 40px;
        }
        iframe {
            width: 100%;
            height: 650px;
            border: none;
            display: block;
        }

        /* Patička webu */
        footer {
            background-color: #050505;
            padding: 40px 20px;
            text-align: center;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.9em;
        }
        footer .footer-logo {
            font-weight: bold;
            font-size: 1.4em;
            letter-spacing: 2px;
            color: var(--text-main);
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <!-- Navigace -->
    <nav>
        <div class="nav-container">
            <div class="logo-text">MINEXCORE</div>
            <div class="links">
                <a href="#domu">Novinky</a>
                <a href="#o-serveru">O serveru</a>
                <a href="#pravidla">Pravidla</a>
                <a href="#mapa">Mapa</a>
            </div>
        </div>
    </nav>

    <!-- Hero záhlaví -->
    <header id="domu">
        <div class="header-sub">Minecraft Server</div>
        <h1>MINEXCORE</h1>
        <div class="header-desc">Objevuj svět, obchoduj mezi hráči, postav si svojí vysněnou bázi a bojuj s monstry.</div>
