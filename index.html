<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚔️ MineXcore | Minecraft Server</title>
    <style>
        /* Moderní rozšířené herní styly z Outlands */
        :root {
            --primary: #4CAF50;
            --primary-glow: rgba(76, 175, 80, 0.25);
            --bg-dark: #070708;
            --bg-card: rgba(18, 18, 22, 0.95);
            --bg-nav: #0d0d10;
            --text-main: #ffffff;
            --text-muted: #cbd5e1;
            --border: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(76, 175, 80, 0.4);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        .vip-banner {
            background: linear-gradient(90deg, #d4af37, #4CAF50);
            color: #000000;
            font-weight: 800;
            padding: 14px 20px;
            text-align: center;
            font-size: 1em;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        nav {
            background-color: var(--bg-nav);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 20px 0;
            border-bottom: 1px solid var(--border);
        }
        nav .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
        }
        nav .logo {
            font-weight: 900;
            font-size: 1.5em;
            letter-spacing: 3px;
            color: var(--text-main);
        }
        nav .menu a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 25px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85em;
            transition: color 0.3s;
        }
        nav .menu a:hover {
            color: var(--primary);
        }

        header {
            position: relative;
            background: linear-gradient(180deg, rgba(20, 35, 20, 0.3) 0%, var(--bg-dark) 100%);
            padding: 140px 20px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header-sub {
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 5px;
            font-weight: 800;
            font-size: 0.9em;
            margin-bottom: 10px;
        }
        h1 {
            margin: 0;
            font-size: 5.5em;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 7px;
            font-weight: 950;
            text-shadow: 0 0 30px var(--primary-glow);
        }
        .header-desc {
            color: var(--text-muted);
            font-size: 1.3em;
            max-width: 800px;
            margin: 25px 0 45px 0;
            line-height: 1.6;
        }
        .cta-buttons {
            display: flex;
            gap: 15px;
        }
        .btn {
            padding: 16px 34px;
            border-radius: 6px;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 0.9em;
            text-decoration: none;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background-color: var(--primary);
            color: #000;
            border: none;
            box-shadow: 0 0 20px var(--primary-glow);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px var(--primary);
        }
        .btn-secondary {
            background-color: rgba(255,255,255,0.02);
            color: var(--text-main);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover {
            background-color: rgba(255,255,255,0.08);
            transform: translateY(-2px);
        }

        .status-bar {
            max-width: 1340px;
            margin: -45px auto 60px auto;
            position: relative;
            z-index: 10;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            padding: 22px;
            gap: 22px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }
        .status-item {
            text-align: center;
            border-right: 1px solid var(--border);
        }
        .status-item:last-child {
            border-right: none;
        }
        .status-title {
            color: var(--text-muted);
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 6px;
            font-weight: 700;
        }
        .status-value {
            font-size: 1.35em;
            font-weight: 800;
        }
        .status-value.online {
            color: var(--primary);
        }

        .container {
            max-width: 1340px;
            margin: 0 auto;
            padding: 0 30px;
        }
        section {
            padding: 90px 0;
            border-bottom: 1px solid var(--border);
            text-align: center;
        }
        section:last-child {
            border-bottom: none;
        }
        .section-title {
            font-size: 2.5em;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            font-weight: 900;
        }
        .section-desc {
            text-transform: uppercase;
            font-size: 0.85em;
            letter-spacing: 2.5px;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 5px;
        }

        .grid-features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 30px;
            margin-top: 45px;
        }
        .feature-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 40px;
            text-align: left;
            transition: all 0.3s;
        }
        .feature-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-4px);
        }
        .feature-card h3 {
            margin: 0 0 15px 0;
            font-size: 1.5em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .feature-card p {
            color: var(--text-muted);
            margin: 0;
            line-height: 1.65;
            font-size: 1.05em;
        }

        .vote-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 800px;
            margin: 40px auto 0 auto;
        }
        .vote-card {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 25px;
            text-decoration: none;
            color: #fff;
            font-weight: 700;
            font-size: 1.1em;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .vote-card:hover {
            border-color: var(--primary);
            background: rgba(76, 175, 80, 0.04);
            transform: translateY(-3px);
        }
        .vote-card span {
            font-size: 0.8em;
            color: var(--text-muted);
            font-weight: 400;
        }

        .accordion {
            max-width: 900px;
            margin: 40px auto 0 auto;
            text-align: left;
        }
        .accordion-item {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 15px;
            overflow: hidden;
        }
        .accordion-header {
            padding: 22px 30px;
            font-weight: 800;
            font-size: 1.2em;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }
        .accordion-header::after {
            content: '🔽';
            font-size: 0.85em;
            transition: transform 0.3s;
        }
        details[open] .accordion-header::after {
            transform: rotate(-180deg);
        }
        details summary { list-style: none; }
        details summary::-webkit-details-marker { display: none; }
        .accordion-content {
            padding: 0 30px 25px 30px;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            padding-top: 20px;
            font-size: 1.05em;
        }
        .accordion-content ul { margin: 0; padding-left: 20px; }
        .accordion-content li { margin-bottom: 12px; line-height: 1.6; }
        .accordion-content li::marker { color: var(--primary); }

        .map-wrapper {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            margin-top: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
        }
        iframe {
            width: 100%;
            height: 720px;

    <script>
        // Živé načítání online hráčů z Hostify serveru
        async function updateServerStatus() {
            try {
                const response = await fetch('https://mcsrvstat.us');
                const data = await response.json();
                const statusElement = document.getElementById('server-status');
                
                if (data.online) {
                    statusElement.innerHTML = `🟢 ONLINE (${data.players.online} / ${data.players.max})`;
                    statusElement.style.color = '#4CAF50';
                } else {
                    statusElement.innerHTML = `🔴 OFFLINE`;
                    statusElement.style.color = '#f44336';
                }
            } catch (error) {
                document.getElementById('server-status').innerHTML = `🟢 ONLINE`;
            }
        }
        
        // Živé načítání celkových hlasů z Craftlistu
        async function updateVotes() {
            try {
                const response = await fetch('https://craftlist.cz');
                if(response.ok) {
                    const data = await response.json();
                    if(data && data.votes) {
                        document.getElementById('total-votes').innerHTML = data.votes;
                    }
                }
            } catch (error) {
                console.log("Záloha hlasů načtena.");
            }
        }

        updateServerStatus();
        updateVotes();
        setInterval(updateServerStatus, 25000); // Obnova každých 25 sekund
    </script>
